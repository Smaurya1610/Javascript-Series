<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .main {
            width: 90vmin;
            height: 90vmin;
            /* box-sizing: border-box; */
            border: 1px solid black;
        }

        .upper {
            width: 100%;
            height: 40%;
            display: flex;
        }

        .square {
            height: 100%;
            width: 40%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid black;
            
        }
        #red{
            background-color: red;;

        }
        #green{
            background-color: green;
        }
        #yellow{
            background-color: yellow;
        }
        #blue{
            background-color: rgb(7, 170, 235);
        }
        .small_square{
            background-color: white;
            width: 75%;
            height: 75%;
            display: grid;
            grid-template-columns: 50% 50%;
            border: 1px solid black;
        }
        .a{
            width: 50%;
            height: 50%;
            margin: 25%;
            border-radius: 21px;
            border: 1px solid black;
        }

        .rectangle {
            height: 100%;
            width: 20%;
            display: flex;
        }
        .L{
            
            width: 33.3%;
            height: 100%;
        }
        .L_box{
            width: 100%;
            height: 16.7%;
            border: 1px solid black;
        }

        .star{
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgb(33, 33, 30);
            font-size: 25px;
            font-weight:bold ;

        }
        .arrow{
            font-size: 23px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            color: black;
        }

        .middle {
            width: 100%;
            height: 20%;
            display: flex;
        }
        .middle_1{
            height: 100%;
            width: 40%;
            
        }
        .middle_1_A{
            width: 100%;
            height: 33.3%;
            display: flex;
        }
        .middle_1_A_a{
            height: 100%;
            width: 16.7%;
            border: 1px solid black;
        }
        .middle_2{
            height: 100%;
            width: 20%;
            background-color: blueviolet;
            border: 1px solid black;
        }
        .lower {
            width: 100%;
            height: 40%;
            display: flex;
            
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="upper">
            <div id="red" class="square">
                <div class="small_square">
                    <div id="red" class="a"></div>
                    <div id="red" class="a"></div>
                    <div id="red" class="a"></div>
                    <div id="red" class="a"></div>
                </div>
            </div>
            <div class="rectangle">
                <div class="L">
                    <div class="L_box"></div>
                    <div class="L_box"></div>
                    <div class="L_box star">★</div>
                    <div class="L_box"></div>
                    <div class="L_box"></div>
                    <div class="L_box"></div>
                </div>
                <div class="L">
                    <div class="L_box arrow">&darr;</div>
                    <div id="green" class="L_box"></div>
                    <div id="green" class="L_box"></div>
                    <div id="green" class="L_box"></div>
                    <div id="green" class="L_box"></div>
                    <div id="green" class="L_box"></div>
                </div>
                <div class="L">
                    <div class="L_box"></div>
                    <div id="green" class="L_box star">★</div>
                    <div class="L_box"></div>
                    <div class="L_box"></div>
                    <div class="L_box"></div>
                    <div class="L_box"></div>
                </div>
            </div>
            <div id="green" class="square">
                <div class="small_square">
                    <div id="green" class="a"></div>
                    <div id="green" class="a"></div>
                    <div id="green" class="a"></div>
                    <div id="green" class="a"></div>
                </div>
            </div>
        </div>

        <div class="middle">
            <div class="middle_1">
                <div class="middle_1_A">
                    <div class="middle_1_A_a"></div>
                    <div id="red" class="middle_1_A_a star">★</div>
                    <div class="middle_1_A_a"></div>
                    <div class="middle_1_A_a"></div>
                    <div class="middle_1_A_a"></div>
                    <div class="middle_1_A_a"></div>
                </div>
                <div class="middle_1_A">
                     <div class="middle_1_A_a arrow">&rarr;</div>
                    <div id="red" class="middle_1_A_a"></div>
                    <div id="red" class="middle_1_A_a"></div>
                    <div id="red" class="middle_1_A_a"></div>
                    <div id="red" class="middle_1_A_a"></div>
                    <div id="red" class="middle_1_A_a"></div>
                </div>
                <div class="middle_1_A">
                     <div class="middle_1_A_a"></div>
                    <div class="middle_1_A_a"></div>
                    <div class="middle_1_A_a star">★</div>
                    <div class="middle_1_A_a"></div>
                    <div class="middle_1_A_a"></div>
                    <div class="middle_1_A_a"></div>
                </div>
            </div>
            <div class="middle_2"></div>
            <div class="middle_1">
                <div class="middle_1_A">
                    <div class="middle_1_A_a"></div>
                    <div class="middle_1_A_a"></div>
                    <div class="middle_1_A_a"></div>
                    <div class="middle_1_A_a star">★</div>
                    <div class="middle_1_A_a"></div>
                    <div class="middle_1_A_a"></div>
                </div>
                <div class="middle_1_A">
                     <div id="yellow" class="middle_1_A_a"></div>
                    <div id="yellow" class="middle_1_A_a"></div>
                    <div id="yellow"class="middle_1_A_a"></div>
                    <div id="yellow"class="middle_1_A_a"></div>
                    <div id="yellow"class="middle_1_A_a"></div>
                    <div class="middle_1_A_a arrow">&larr;</div>
                </div>
                <div class="middle_1_A">
                     <div class="middle_1_A_a"></div>
                    <div class="middle_1_A_a"></div>
                    <div class="middle_1_A_a"></div>
                    <div class="middle_1_A_a"></div>
                    <div id="yellow" class="middle_1_A_a star">★</div>
                    <div class="middle_1_A_a"></div>
                </div>
            </div>
        </div>

        <div class="lower">
            <div id="blue" class="square">
                <div class="small_square">
                    <div id="blue" class="a"></div>
                    <div id="blue" class="a"></div>
                    <div id="blue" class="a"></div>
                    <div id="blue" class="a"></div>
                </div>
            </div>
            <div class="rectangle">
                <div class="L">
                    <div class="L_box"></div>
                    <div class="L_box"></div>
                    <div class="L_box"></div>
                    <div class="L_box"></div>
                    <div id="blue" class="L_box star">★</div>
                    <div class="L_box"></div>
                </div>
                <div class="L">
                    <div id="blue"class="L_box"></div>
                    <div id="blue" class="L_box"></div>
                    <div id="blue" class="L_box"></div>
                    <div id="blue" class="L_box"></div>
                    <div id="blue"class="L_box"></div>
                    <div class="L_box arrow">&uarr;</div>
                </div>
                <div class="L">
                    <div class="L_box"></div>
                    <div class="L_box"></div>
                    <div class="L_box"></div>
                    <div class="L_box star">★</div>
                    <div class="L_box"></div>
                    <div class="L_box"></div>
                </div>
            </div>
            <div id="yellow" class="square">
                <div class="small_square">
                    <div id="yellow" class="a"></div>
                    <div id="yellow" class="a"></div>
                    <div id="yellow" class="a"></div>
                    <div id="yellow" class="a"></div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
