    <title>Document</title>
     <style>

}

body{

}

.outer{

}
/* Header */

.header{
    width:100%;
    height:50%;

}

.a{

}

.b{
    width:50%;

}

/* Lower */

.lower{
    width:100%;

}

.c{
    width:50%;

}

.d{
    width:50%;
    height:100%;
    background:#b3d67b;
}

    height:50%;

}

.c_lower_a_4_2{

}

.c_lower_a_4_3{
