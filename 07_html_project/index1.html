<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body{
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }
    .outer{
    width:90vmin;
    height:90vmin;
    border:1px solid black;
    }
    .a{
        width: 100%;
        height: 40%;
        


    }
    .a_header{
        width: 100%;
        height: 30%;
        display: flex;
        background-color: rgb(242, 109, 126);
    }
    .a_header_1{
        width: 50%;
        height: 100%;
        display: flex;
        
    }
    .a_header_1_A{
        width: 30%;
        height: 100%;
        background-color: rgb(237, 27, 36);
    }
    .a_header_1_B{
        width: 70%;
        height: 100%;
        background-color: rgb(242, 109, 126);
    }
    .a_header_2{
        width: 50%;
        height: 100%;
        display: flex;
    
    }
    .a_header_2_A{
        width: 70%;
        height: 100%;
        background-color: rgb(242, 109, 126);
    }
    .a_header_2_B{
        width: 30%;
        height: 100%;
        background-color: rgb(237, 27, 36);
    }
    .a_lower{
        width: 100%;
        height: 70%;
        display: flex;
    }
    .a_lower_1{
        width: 50%;
        height: 100%;
        background-color: rgb(240, 110, 170);
        
    }
    .a_lower_2{
        width: 50%;
        height: 100%;    
    }
    .a_lower_2_A{
        width: 100%;
        height: 50%;  
        background-color: rgb(46, 49, 146);  
    }
    .a_lower_2_B{
        width: 100%;
        height: 50%;    
        display: flex;
    }
    .a_lower_2_B_a{
        width: 50%;
        height: 100%;   
        background-color: rgb(146, 39, 143); 
        
    }
    .a_lower_2_B_b{
        width: 50%;
        height: 100%;   
        background-color:  rgb(125, 167, 217); 
        
    }
    .b{
        width: 100%;
        height: 60%;
        /* background-color: black; */
        
    }
    .b_header{
        width: 100%;
        height: 50%;
        display: flex;
    }
    .b_header_1{
        width: 50%;
        height: 100%;
        background-color: rgb(109, 207, 246);
    }
    .b_header_2{
        width: 50%;
        height: 100%;
        background-color: rgb(240, 110, 170);
    }
    .b_lower{
        width: 100%;
        height: 50%;
        display: flex;
    }
    .b_lower_1{
        width: 50%;
        height: 100%;
        
    }
    .b_lower_1_A{
        width: 100%;
        height: 50%;
        background-color:rgb(0, 119, 162) ;
        
    }
    .b_lower_1_B{
        width: 100%;
        height: 50%;
        background-color:  rgb(0, 52, 112);
        
    }
    .b_lower_2{
        width: 50%;
        height: 100%;
        background-color:rgb(135, 129, 189) ;
        
    }

</style>
<body>
    <div class="outer">
        <div class="a">
            <div class="a_header">
                <div class="a_header_1">
                    <div class="a_header_1_A"></div>
                    <div class="a_header_1_B"></div>
                </div>
                <div class="a_header_2">
                    <div class="a_header_2_A"></div>
                    <div class="a_header_2_B"></div>
                </div>
            </div>
            <div class="a_lower">
                <div class="a_lower_1"></div>
                <div class="a_lower_2">
                    <div class="a_lower_2_A"></div>
                    <div class="a_lower_2_B">
                        <div class="a_lower_2_B_a"></div>
                        <div class="a_lower_2_B_b"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="b">
            <div class="b_header">
                <div class="b_header_1"></div>
                <div class="b_header_2"></div>
            </div>
            <div class="b_lower">
                <div class="b_lower_1">
                    <div class="b_lower_1_A"></div>
                    <div class="b_lower_1_B"></div>
                </div>
                <div class="b_lower_2"></div>
            </div>
        </div>
        
    </div>
</body>
</html>
